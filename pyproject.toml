[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finai-br"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "settings"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agents = ["prompt/*.yaml"]