services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finai
      POSTGRES_USER: finai
      POSTGRES_PASSWORD: finai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finai -d finai"]
      interval: 5s
      timeout: 5s
      retries: 10

  finai:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: python -m main scheduler

volumes:
  postgres_data:
