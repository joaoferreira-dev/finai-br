name: CI

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test and compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test
        run: pytest -q --cov=src --cov-report=term-missing

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: finai-br:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform Quality & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check -diff

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Generate temporary plan key
        run: |
          ssh-keygen -t ed25519 -N '' -C "finai-ci" -f "$RUNNER_TEMP/finai_ci_key"
          echo "CI_SSH_PUBLIC_KEY=$(cat "$RUNNER_TEMP/finai_ci_key.pub")" >> "$GITHUB_ENV"

      - name: Authenticate to GCP (Optional for Live Plan)
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Plan
        if: ${{ env.GCP_SA_KEY != '' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="admin_ssh_public_key=$CI_SSH_PUBLIC_KEY" \
            -input=false

  create-pr:
    name: Create pull request to main
    if: github.event_name == 'push'
    needs: [test, docker, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request if one does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing_pr_url="$(gh pr list \
            --state open \
            --base main \
            --head "$HEAD_BRANCH" \
            --json url \
            --jq '.[0].url // empty')"

          if [ -n "$existing_pr_url" ]; then
            echo "An open pull request already exists: $existing_pr_url"
          else
            gh pr create \
              --base main \
              --head "$HEAD_BRANCH" \
              --title "$HEAD_BRANCH" \
              --body "Automated pull request created after CI succeeded."
          fi
